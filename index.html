<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>拾页 · 公开学习笔记</title>
  <link rel="stylesheet" href="./vendor/katex/katex.min.css">
  <style>
    :root { --ink:#20221d; --muted:#73766d; --paper:#f5f1e8; --card:#fffdf7; --line:#ddd7ca; --accent:#35695a; --accent2:#d86b43; }
    *{box-sizing:border-box} body{margin:0;color:var(--ink);background:var(--paper);font:15px/1.7 system-ui,-apple-system,"Segoe UI",sans-serif}
    .shell{display:grid;grid-template-columns:320px 1fr;min-height:100vh}.side{border-right:1px solid var(--line);padding:30px 24px;background:#ede8dc;position:sticky;top:0;height:100vh;overflow:auto}
    h1{font:700 30px/1.1 Georgia,serif;margin:0 0 8px}.sub,.meta,.empty{color:var(--muted)}.privacy{margin:22px 0;padding:11px 13px;border:1px solid #b9cbbf;background:#edf4ef;border-radius:10px;color:#315347;font-size:13px}
    button,.file-label{border:0;border-radius:9px;padding:10px 13px;background:var(--accent);color:white;cursor:pointer;font:inherit;display:inline-block}.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}input[type=file]{display:none}
    .actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.search{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:var(--card);font:inherit;outline:none}.search:focus{border-color:var(--accent)}
    .list{margin-top:18px}.item{padding:13px 5px;border-bottom:1px solid var(--line);cursor:pointer}.item:hover,.item.active{color:var(--accent)}.item strong{display:block}.item small{color:var(--muted)}
    main{padding:56px clamp(28px,7vw,110px);max-width:1050px}.hero{display:flex;align-items:start;justify-content:space-between;gap:20px;border-bottom:1px solid var(--line);padding-bottom:24px;margin-bottom:34px}.hero h2{font:700 38px/1.2 Georgia,serif;margin:0 0 10px}.tags{display:flex;gap:7px;flex-wrap:wrap}.tag{background:#e4ded0;border-radius:99px;padding:2px 9px;font-size:12px}
    article{font-size:17px;max-width:820px}article h1,article h2,article h3{font-family:Georgia,"Noto Serif SC",serif;line-height:1.35;margin-top:1.9em;scroll-margin-top:24px}article h1{font-size:30px;border-bottom:1px solid var(--line);padding-bottom:.35em}article h2{font-size:24px;color:#293f37}article h3{font-size:19px}article p{margin:1em 0}article code{background:#e9e4d9;padding:2px 5px;border-radius:4px}article pre{background:#252820;color:#f4f1e8;padding:17px;border-radius:10px;overflow:auto}article pre code{background:none;padding:0}article blockquote{margin:1.4em 0;border-left:3px solid var(--accent2);padding:8px 18px;background:#f0ebe0;color:#555;border-radius:0 8px 8px 0}article img{max-width:100%;height:auto;border-radius:8px}article a{color:var(--accent)}article ul,article ol{padding-left:1.5em}article li{margin:.3em 0}article table{width:100%;border-collapse:collapse;margin:1.5em 0;font-size:14px;display:block;overflow-x:auto;white-space:nowrap}article th,article td{border:1px solid var(--line);padding:9px 12px;text-align:left;vertical-align:top}article th{background:#e8e2d6;color:#294b40;font-weight:700}article tr:nth-child(even) td{background:#faf7f0}.katex-display{overflow-x:auto;overflow-y:hidden;padding:.65em 0;margin:1.4em 0}.katex{font-size:1.05em}
    .welcome{padding:50px 0}.welcome h2{font:700 38px Georgia,serif}.welcome .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:32px}.step{background:var(--card);border:1px solid var(--line);padding:19px;border-radius:12px}.step b{display:block;color:var(--accent2);font-size:12px;letter-spacing:.08em;margin-bottom:7px}
    dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);padding:24px;width:min(560px,90vw)}textarea{width:100%;min-height:280px;border:1px solid var(--line);border-radius:8px;padding:12px;font:14px/1.6 ui-monospace,monospace}dialog .row{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
    @media(max-width:760px){.shell{display:block}.side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}main{padding:32px 22px}.welcome .steps{grid-template-columns:1fr}.hero h2{font-size:30px}}
  </style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <h1>拾页</h1><div class="sub">我的公开学习笔记</div>
    <div class="privacy">🌿 持续学习，持续记录</div>
    <input id="search" class="search" placeholder="搜索标题、标签或正文…" />
    <div id="list" class="list"></div>
  </aside>
  <main id="main"></main>
</div>
<script src="./vendor/marked.umd.js"></script>
<script src="./vendor/purify.min.js"></script>
<script src="./vendor/katex/katex.min.js"></script>
<script src="./vendor/katex/auto-render.min.js"></script>
<script>
const PUBLIC_NOTES=[{id:'welcome-note',title:'如何建立有效的学习循环',date:'2026-08-08',tags:['学习方法','复习','AI'],body:`# 如何建立有效的学习循环

## 核心流程

- 获取新知识
- 用自己的话复述
- 做一次小测试
- 根据错误安排复习

> AI 可以帮助整理材料和生成题目，但最终理解应该由自己验证。

## 给 AI 的提示词

\`\`\`text
请把下面的材料整理成 Markdown 学习笔记，保留例子，
并在最后生成 5 道用于主动回忆的问题。
\`\`\`

## 下一步

尝试在一天、一周和一个月后分别复习。`,raw:''}]; let notes=[]; let selected=null;
const $=s=>document.querySelector(s); const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function parse(raw,name='未命名笔记.md'){let data={},body=raw;if(raw.startsWith('---')){const end=raw.indexOf('\n---',3);if(end>-1){raw.slice(3,end).trim().split('\n').forEach(line=>{const i=line.indexOf(':');if(i>0)data[line.slice(0,i).trim()]=line.slice(i+1).trim().replace(/^['"]|['"]$/g,'')});body=raw.slice(end+4).trim()}}let tags=data.tags?data.tags.replace(/^\[|\]$/g,'').split(',').map(x=>x.trim()).filter(Boolean):[];return{id:crypto.randomUUID(),title:data.title||name.replace(/\.md$/i,''),date:data.date||new Date().toISOString().slice(0,10),tags,body,raw}}
function md(s){const math=[];let protectedMd=s.replace(/\$\$([\s\S]*?)\$\$/g,(_,formula)=>{const i=math.push({formula,display:true})-1;return `MATHBLOCKTOKEN${i}XYZ`}).replace(/\$([^$\n]+?)\$/g,(_,formula)=>{const i=math.push({formula,display:false})-1;return `MATHINLINETOKEN${i}XYZ`});let html=DOMPurify.sanitize(marked.parse(protectedMd,{gfm:true,breaks:false}));html=html.replace(/<p>MATHBLOCKTOKEN(\d+)XYZ<\/p>/g,(_,i)=>`<div class="math-block">$$${esc(math[Number(i)].formula)}$$</div>`).replace(/MATHBLOCKTOKEN(\d+)XYZ/g,(_,i)=>`<div class="math-block">$$${esc(math[Number(i)].formula)}$$</div>`).replace(/MATHINLINETOKEN(\d+)XYZ/g,(_,i)=>`$${esc(math[Number(i)].formula)}$`);return html}
function renderList(){const q=$('#search').value.toLowerCase();const found=notes.filter(n=>(n.title+' '+n.tags.join(' ')+' '+n.body).toLowerCase().includes(q));$('#list').innerHTML=found.length?found.map(n=>`<div class="item ${selected===n.id?'active':''}" data-id="${n.id}"><strong>${esc(n.title)}</strong><small>${esc(n.date)} · ${n.tags.length?n.tags.map(esc).join(' / '):'未分类'}</small></div>`).join(''):`<div class="empty">${notes.length?'没有匹配结果':'还没有笔记'}</div>`;document.querySelectorAll('.item').forEach(el=>el.onclick=()=>show(el.dataset.id))}
function show(id){selected=id;const n=notes.find(x=>x.id===id);if(!n)return;$('#main').innerHTML=`<header class="hero"><div><h2>${esc(n.title)}</h2><div class="meta">${esc(n.date)}</div><div class="tags">${n.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div></div></header><article>${md(n.body)}</article>`;if(typeof renderMathInElement==='function')renderMathInElement($('#main article'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false,strict:false});renderList()}
function welcome(){if(notes.length){show(notes[0].id);return}$('#main').innerHTML=`<section class="welcome"><div class="meta">LOCAL-FIRST NOTES</div><h2>把知识留在自己的书桌上。</h2><p>导入 Markdown 文件，建立一个无需账号、无需服务器的私人学习空间。</p><div class="steps"><div class="step"><b>01 · 准备</b>让 AI 输出带标题和标签的 Markdown。</div><div class="step"><b>02 · 导入</b>选择一个或多个 .md 文件。</div><div class="step"><b>03 · 备份</b>定期导出 JSON，避免清理浏览器数据时丢失。</div></div></section>`}
$('#search').oninput=renderList;
async function ensureMathRenderer(){if(typeof renderMathInElement!=='function')throw new Error('本地 KaTeX 未加载')}
async function loadPublishedNotes(){try{await ensureMathRenderer()}catch(error){console.warn('数学公式渲染器加载失败',error)}try{const manifest=await fetch('./notes/index.json').then(r=>{if(!r.ok)throw new Error('manifest');return r.json()});notes=await Promise.all(manifest.map(async item=>{const raw=await fetch('./'+item.path).then(r=>{if(!r.ok)throw new Error(item.path);return r.text()});const note=parse(raw,item.path.split('/').pop());note.id=item.path;return note}))}catch(error){console.warn('使用内置示例笔记',error);notes=PUBLIC_NOTES}renderList();welcome()}
loadPublishedNotes();
</script>
</body></html>
